<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test Application Form</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 20px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
  fieldset { margin: 14px 0; border: 1px solid #bbb; border-radius: 8px; padding: 10px 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .inline { display: flex; gap: 18px; align-items: center; margin-top: 6px; }
  .inline label { display: inline; font-weight: 400; margin: 0; }
  .inline input { width: auto; }
  button { margin-top: 22px; padding: 10px 22px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<h1>Apply: Senior Java Backend Engineer</h1>
<p>Fixture form for JobHunt autofill tests. Do not submit.</p>
<form id="application_form">
  <div class="row">
    <div><label for="first_name">First name *</label><input id="first_name" name="first_name" required></div>
    <div><label for="last_name">Last name *</label><input id="last_name" name="last_name" required></div>
  </div>
  <div class="row">
    <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
    <div><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required></div>
  </div>
  <label for="linkedin">LinkedIn profile</label><input id="linkedin" name="linkedin" type="url">
  <div class="row">
    <div><label for="current_company">Current company</label><input id="current_company" name="current_company"></div>
    <div><label for="current_title">Current job title</label><input id="current_title" name="current_title"></div>
  </div>
  <label for="years">Years of experience</label><input id="years" name="years_experience" type="number">
  <label for="notice">Notice period</label>
  <select id="notice" name="notice_period">
    <option value="">Select</option>
    <option value="immediate">Immediately</option>
    <option value="15">15 days</option>
    <option value="30">30 days</option>
    <option value="60">60 days</option>
  </select>
  <label for="expected_ctc">Expected CTC</label><input id="expected_ctc" name="expected_ctc">
  <fieldset>
    <legend>Are you legally authorized to work in India?</legend>
    <div class="inline">
      <label><input type="radio" name="work_auth" value="yes"> Yes</label>
      <label><input type="radio" name="work_auth" value="no"> No</label>
    </div>
  </fieldset>
  <label for="relocate">Are you willing to relocate?</label>
  <select id="relocate" name="relocate">
    <option value="">Select</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>
  <label for="resume">Resume / CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required>
  <label for="cover">Cover letter (optional)</label><input id="cover" name="cover_letter" type="file" accept=".pdf,.doc,.docx">
  <label for="why">Why are you interested in this role at Acme Systems?</label>
  <textarea id="why" name="why" rows="3"></textarea>
  <label for="challenge">Tell us about a challenging project you worked on.</label>
  <textarea id="challenge" name="challenge" rows="3"></textarea>
  <label for="notice_text">What is your notice period?</label>
  <textarea id="notice_text" name="notice_text" rows="2"></textarea>
  <label for="additional">Anything else we should know?</label>
  <textarea id="additional" name="additional" rows="2"></textarea>
  <div class="inline">
    <label><input type="checkbox" name="consent"> I agree to the privacy policy and consent to processing my application.</label>
  </div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
